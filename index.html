<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL 2인 3팀 온라인 경매</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><header><h1>🏆 LoL 2인 3팀 온라인 경매</h1><p>각자 3팀 · 10/11/10/10/10명 선수 풀 · 포지션별 상대 최소 3명 보장</p></header>
<section id="join" class="card"><h2>방 입장</h2><input id="name" placeholder="내 이름"><div class="buttons"><button onclick="create()">방 만들기</button><input id="code" placeholder="방 코드"><button onclick="join()">참가</button></div><div id="joinmsg"></div></section>
<section id="game" hidden>
<div class="roomline">방 코드 <b id="roomcode"></b> · <span id="phase"></span></div><div id="unsoldPanel" class="card"><b>미낙찰 선수: <span id="unsoldCount">0</span>명</b> <button id="startUnsold" onclick="startUnsold()">미낙찰 경매 시작</button><div id="unsoldList"></div></div>
<div class="grid"><div class="card"><h2>현재 선수</h2><div id="current">대기 중</div><button id="draw" onclick="draw()">🎲 다음 선수</button><div id="bidbox" hidden><div>현재가: <b id="bid"></b> P</div><input id="bidamount" type="number"><button onclick="bid()">입찰</button><button onclick="win()">낙찰 확정</button><div id="bidder"></div></div></div>
<div class="card"><h2>플레이어</h2><div id="users"></div></div></div>
<div class="card"><h2>경매 기록</h2><div id="history"></div></div>
<div class="card"><h2>남은 선수 <span id="remain"></span></h2><div id="remaining"></div></div>
</section></div><script src="app.js"></script></body></html>
